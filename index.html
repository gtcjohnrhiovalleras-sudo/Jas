<!DOCTYPE html>
<html lang="en">

<head>

<title>For Someone Special ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Loading Screen -->

<div id="loading">

<h1>A Gift Is Waiting ❤️</h1>

<div class="loader">

<div class="progress"></div>

</div>

<p>Loading Love...</p>

</div>



<!-- Password Screen -->

<div id="login" class="hidden">

<h1>🌹</h1>

<h2>Enter Your Secret Name</h2>

<input id="nameInput" placeholder="Your Name">

<button id="openGift">

Open My Gift ❤️

</button>

</div>



<!-- Main Website -->

<div id="main" class="hidden">

<canvas id="stars"></canvas>

<div id="fireflies"></div>

<div id="flowerScene"></div>

<div id="message"></div>

<div id="heart"></div>

</div>



<script src="script.js"></script>

</body>

</html>
